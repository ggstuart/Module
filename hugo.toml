[params]
    moduleName = 'Your module name'
    moduleCode = 'MODULE_CODE'

[markup.highlight]
    noClasses = false
    linenos = true

[outputs]
    _merge = "deep"
    home = ["html", "slideLayouts"]

[outputFormats.slideLayouts]
    _merge = "deep"
    mediaType = "text/css"
    baseName = "css/slide-layouts"
    isPlainText = true