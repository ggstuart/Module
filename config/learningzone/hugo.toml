# Learning Zone (Brightspace) export.
#
# Hugo only reads this file when you build with `--environment learningzone`,
# so a normal `hugo` build is unaffected. See "Learning Zone export" in the
# theme readme for the few settings a site has to add itself.

[outputFormats.lz]
  # The page format used inside the package. Same HTML as the website, but
  # rendered with layouts/_default/baseof.lz.html (no header, menu,
  # breadcrumbs or footer).
  mediaType = "text/html"
  isHTML = true
  baseName = "index"
  permalinkable = true

[outputFormats.imsmanifest]
  # IMS Common Cartridge 1.1 manifest (imsmanifest.xml at the package root).
  # Its template also writes the imscc.xml marker file.
  mediaType = "application/xml"
  baseName = "imsmanifest"
  isPlainText = true
  notAlternative = true

[outputs]
  # Sites that set their own `[outputs] home = [...]` must set home outputs in
  # their own config/learningzone/hugo.toml too (the GitHub Action does this for you).
  home = ["lz", "slideLayouts", "imsmanifest"]
  section = ["lz"]
  page = ["lz"]

[params.learningzone]
  # Title of the top-level folder created in Learning Zone.
  # Defaults to "<moduleCode>: <moduleName>".
  # title = "CTEC2712 Web application development"

  # Add the home page as the first topic ("About this module").
  includeHome = true

  # Which top-level sections become folders. "unit" means only sections with
  # `type: unit` (sorted by weight). Set to "" to include every section that has pages.
  sectionType = "unit"

  # Download web fonts and Mermaid at build time and put them in the package,
  # so nothing is loaded from the internet inside Learning Zone.
  bundleFonts = true
  fontsURL = "https://fonts.googleapis.com/css2?family=Ubuntu+Mono&family=Ubuntu:wght@300;400;500;700&family=Rokkitt:wght@100;300;400;500;600&display=swap"
  mermaidURL = "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js"

# Hugo replaces a theme's default mounts when it declares any, so the
# standard ones are repeated here. The extra mount makes the theme's static
# files visible to templates, so the manifest can list them.
[[module.mounts]]
  source = "archetypes"
  target = "archetypes"
[[module.mounts]]
  source = "layouts"
  target = "layouts"
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = "static"
  target = "assets/_lz/theme-static"
